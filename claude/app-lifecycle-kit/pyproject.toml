# Python project metadata for the plugin's code. There is nothing to install: the server and hooks use only
# the standard library, because Claude Code installs plugins without running any install step.
# Claude Code starts them with plain `python3` (see .mcp.json and hooks/hooks.json). Keep `version` the same
# as the plugin manifest's.
#
#   uv run -m unittest discover -s tests
#   uv run scripts/smoke_test.py
[project]
name = "app-lifecycle-kit"
version = "1.0.0"
description = "Claude Code plugin: requirements → design → build → test → deploy with persistent, traceable lifecycle state"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false   # scripts run in place; nothing is built or installed
